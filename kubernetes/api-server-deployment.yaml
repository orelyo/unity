apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server-customer-management
  labels:
    app: api-server-customer-management
    assignment-uuid: e271b052-9200-4502-b491-62f1649c07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server-customer-management
  template:
    metadata:
      labels:
        app: api-server-customer-management
        assignment-uuid: e271b052-9200-4502-b491-62f1649c07
    spec:
      containers:
        - name: api-server
          image: api-server-customer-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: api-server-config
                  key: MONGODB_URI
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: api-server-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CONSUMER_HEARTBEAT_MS
              valueFrom:
                configMapKeyRef:
                  name: api-server-config
                  key: KAFKA_CONSUMER_HEARTBEAT_MS
            - name: KAFKA_CONSUMER_SESSION_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: api-server-config
                  key: KAFKA_CONSUMER_SESSION_TIMEOUT_MS
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: api-server-config
                  key: KAFKA_CONSUMER_GROUP_ID
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
# maintainer: automated-checking
