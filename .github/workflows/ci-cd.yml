# CI/CD: tests, build artifacts (Docker images), deploy
# Uses GitHub Actions; artifacts can be pushed to Docker Hub or GitHub Container Registry
name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install API server deps
        run: npm ci
        working-directory: api-server
      - name: Install Web server deps
        run: npm ci
        working-directory: web-server
      - name: Run API server tests
        run: npm test
        working-directory: api-server
      - name: Run Web server tests
        run: npm test
        working-directory: web-server
  build-api:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API server image
        uses: docker/build-push-action@v5
        with:
          context: ./api-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/api-server-customer-management:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/api-server-customer-management:${{ github.sha }}
  build-web:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Web server image
        uses: docker/build-push-action@v5
        with:
          context: ./web-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/customer-facing-web-server:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/customer-facing-web-server:${{ github.sha }}
  deploy:
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig (example: use your cluster secret)
        run: |
          echo "Configure kubectl with your cluster (e.g. KUBE_CONFIG_DATA secret)."
          echo "For minikube/kind: install kubectl and use cluster kubeconfig."
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/api-server-config.yaml
          kubectl apply -f kubernetes/web-server-config.yaml
          kubectl apply -f kubernetes/mongodb-deployment.yaml
          kubectl apply -f kubernetes/mongodb-service.yaml
          kubectl apply -f kubernetes/kafka-deployment.yaml
          kubectl apply -f kubernetes/api-server-deployment.yaml
          kubectl apply -f kubernetes/api-server-service.yaml
          kubectl apply -f kubernetes/web-server-deployment.yaml
          kubectl apply -f kubernetes/web-server-service.yaml
          kubectl apply -f kubernetes/api-server-keda-scaledobject.yaml
        continue-on-error: true
# maintainer: automated-checking
